<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miku Microeconomics: NSX Edition</title>
    <style>
        body {
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background-color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; user-select: none;
            touch-action: none;
        }
        #gameContainer {
            position: relative; width: 800px; height: 400px;
            max-width: 100vw; 
            border: 4px solid #fff; background: linear-gradient(to bottom, #2c3e50, #3498db);
            cursor: pointer;
        }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none;
        }
        #questionBox {
            position: absolute; top: 10px; right: 10px; z-index: 10;
            background: rgba(255, 255, 255, 0.95); padding: 10px;
            border-radius: 10px; border: 3px solid #f1c40f;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); text-align: center;
            width: 40%; max-width: 360px; 
        }
        .q-title { color: #e74c3c; font-size: 12px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase;}
        .q-text { color: #2c3e50; font-size: 14px; font-weight: 700; line-height: 1.3; }
        
        .text-stroke { color: white; font-size: 20px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        
        #gameOverScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 20;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
        
        canvas { width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="ui-layer">
            <div class="text-stroke" id="scoreText">Điểm: 0</div>
            <div class="text-stroke" style="font-size: 12px; margin-top: 5px; color: #feca57;">Chạm màn hình để bay!</div>
        </div>

        <div id="questionBox">
            <div class="q-title" id="chapterName">CHƯƠNG...</div>
            <div class="q-text" id="mathQuestion">Đang tải câu hỏi...</div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="gameOverScreen">
            <h1 class="text-stroke" style="font-size: 35px; color: #ff6b6b; margin-bottom: 10px;">SAI KIẾN THỨC!</h1>
            <h2 class="text-stroke" id="correctAnswerInfo" style="color: #1dd1a1; font-size: 14px; line-height: 1.4; margin: 10px; white-space: pre-wrap;"></h2>
            <p class="text-stroke blink" style="font-size: 16px; margin-top: 15px;">Chạm để chơi lại</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreText');
        const goScreen = document.getElementById('gameOverScreen');
        const questionEl = document.getElementById('mathQuestion');
        const chapterEl = document.getElementById('chapterName');
        const infoEl = document.getElementById('correctAnswerInfo');

        const playerImg = new Image(); playerImg.src = 'miku.png';

        let gameRunning = true;
        let score = 0;
        let gameSpeed = 1.8; 
        let frame = 0;
        let walls = [];
        const GROUND_HEIGHT = 20;
        const PLAY_AREA = canvas.height - GROUND_HEIGHT; 

        // --- BỘ ĐỀ THI VI MÔ (HÀNH VI NGƯỜI SẢN XUẤT) ---
        const questionBank = [
            { chapter: "Chương: Hành vi NSX", text: "121. Chi phí chìm chính là một loại chi phí ẩn.", answer: "SAI", explain: "Chi phí chìm là chi phí đã xảy ra và không thể thu hồi, khác hoàn toàn với chi phí ẩn (chi phí cơ hội)." },
            { chapter: "Chương: Hành vi NSX", text: "122. Kế toán viên ghi chép các luồng tiền ra vào, do đó không quan tâm đến chi phí hiện.", answer: "SAI", explain: "Kế toán viên RẤT quan tâm đến chi phí hiện (chi phí kế toán). Họ chỉ bỏ qua chi phí ẩn." },
            { chapter: "Chương: Hành vi NSX", text: "123. Khoảng cách theo chiều dọc giữa ATC và AVC luôn không đổi ở mọi mức sản lượng.", answer: "SAI", explain: "Khoảng cách đó chính là AFC. Khi sản lượng tăng, AFC sẽ giảm dần về 0 nên khoảng cách hẹp dần." },
            { chapter: "Chương: Hành vi NSX", text: "124. Nếu chi phí cận biên (MC) lớn hơn doanh thu cận biên (MR) thì doanh nghiệp nên cắt giảm sản lượng.", answer: "ĐÚNG", explain: "Khi MC > MR, việc sản xuất thêm làm giảm lợi nhuận. Cắt giảm sản xuất sẽ làm tăng lợi nhuận." },
            { chapter: "Chương: Hành vi NSX", text: "125. Khi tổng sản phẩm (TP) đang tăng thì sản phẩm cận biên (MP) vẫn có thể giảm nhưng lớn hơn 0.", answer: "ĐÚNG", explain: "Trong giai đoạn 2 của hàm sản xuất, MP > 0 (TP tăng) nhưng MP đang có xu hướng giảm dần." },
            { chapter: "Chương: Hành vi NSX", text: "126. Nếu đường đồng phí luôn dốc hơn đường đồng lượng, kết hợp tối ưu là chỉ sử dụng vốn (trục tung).", answer: "ĐÚNG", explain: "Đây là giải pháp góc. Hãng sẽ dồn tiền mua yếu tố rẻ hơn tương đối để tối ưu hóa." },
            { chapter: "Chương: Hành vi NSX", text: "127. Đánh thuế vào hãng tối đa hoá doanh thu sẽ làm giá tăng và sản lượng giảm.", answer: "SAI", explain: "Hãng tối đa hóa doanh thu khi MR = 0. Đánh thuế không làm đổi MR, nên P và Q không đổi." },
            { chapter: "Chương: Hành vi NSX", text: "128. Tỉ lệ thay thế kỹ thuật cận biên (MRTS) luôn giảm dần khi tăng sử dụng yếu tố lao động.", answer: "ĐÚNG", explain: "Đó là định nghĩa gốc của Quy luật MRTS giảm dần." },
            { chapter: "Chương: Hành vi NSX", text: "129. Ngắn hạn là khoảng thời gian mà tất cả các yếu tố đầu vào không thay đổi.", answer: "SAI", explain: "Ngắn hạn là khi có ÍT NHẤT MỘT yếu tố cố định, các yếu tố khác (như L) vẫn thay đổi được." },
            { chapter: "Chương: Hành vi NSX", text: "130. Kết hợp sản xuất tối ưu đạt được khi sản xuất một mức sản lượng với chi phí nhỏ nhất.", answer: "ĐÚNG", explain: "Đây là nguyên lý của bài toán tối thiểu hóa chi phí." },
            { chapter: "Chương: Hành vi NSX", text: "131. Nếu tăng hay giảm Q đều làm chi phí bình quân tăng lên thì quy mô hiện tại đang là tối ưu.", answer: "ĐÚNG", explain: "Điều này chứng tỏ hãng đang sản xuất tại điểm cực tiểu của đường chi phí bình quân (đáy chữ U)." },
            { chapter: "Chương: Hành vi NSX", text: "132. Các đường chi phí bình quân trong ngắn hạn luôn có dạng chữ U.", answer: "SAI", explain: "Đường chi phí cố định bình quân (AFC) luôn dốc xuống, không phải hình chữ U." },
            { chapter: "Chương: Hành vi NSX", text: "133. Các yếu tố sản xuất như lao động và máy móc không thể thay thế cho nhau.", answer: "SAI", explain: "Trong dài hạn, hãng hoàn toàn có thể sử dụng công nghệ nhiều máy móc hơn để thay thế lao động." },
            { chapter: "Chương: Hành vi NSX", text: "134. Quy luật MP giảm dần cho biết MP của LĐ sau luôn nhỏ hơn LĐ trước.", answer: "SAI", explain: "Chỉ đúng từ một số lượng lao động nhất định. Ban đầu MP có thể tăng do chuyên môn hóa." },
            { chapter: "Chương: Hành vi NSX", text: "135. Hình dáng của đường TC ngắn hạn không liên quan đến hình dáng của đường tổng sản phẩm TP.", answer: "SAI", explain: "Hình dáng đường chi phí bị chi phối trực tiếp bởi hàm sản xuất (đường TP)." },
            { chapter: "Chương: Hành vi NSX", text: "136. Đường MC và AVC có dạng chữ U là do quy luật sản phẩm cận biên giảm dần.", answer: "ĐÚNG", explain: "MP tăng rồi giảm làm cho MC và AVC giảm rồi tăng (tạo hình chữ U)." },
            { chapter: "Chương: Hành vi NSX", text: "137. Doanh thu bình quân (AR) của hãng luôn bằng mức giá (P) trong mọi trường hợp.", answer: "ĐÚNG", explain: "AR = TR / Q = (P * Q) / Q = P." },
            { chapter: "Chương: Hành vi NSX", text: "138. Khoảng thời gian ngắn hạn có thể khác nhau giữa các hãng nhưng không quá 3 năm.", answer: "SAI", explain: "Ngắn hạn hay dài hạn phụ thuộc vào sự linh hoạt thay đổi quy mô, không quy định bằng thời gian cụ thể." },
            { chapter: "Chương: Hành vi NSX", text: "139. Nếu chi phí cận biên (MC) bắt đầu tăng thì tổng chi phí bình quân (ATC) cũng sẽ tăng.", answer: "SAI", explain: "Nếu MC đang tăng nhưng vẫn NHỎ HƠN ATC thì ATC sẽ tiếp tục giảm." },
            { chapter: "Chương: Hành vi NSX", text: "140. Tổng chi phí bình quân không chịu sự ảnh hưởng của quy luật sản phẩm cận biên giảm dần.", answer: "SAI", explain: "Có chịu ảnh hưởng. Năng suất giảm làm chi phí tăng lên, khiến ATC có nhánh đi lên." },
            { chapter: "Chương: Hành vi NSX", text: "141. Sản phẩm cận biên được tính bằng sản lượng chia cho số đầu vào sử dụng.", answer: "SAI", explain: "Đó là công thức của Sản phẩm BÌNH QUÂN (AP = Q/L), không phải sản phẩm cận biên (MP)." },
            { chapter: "Chương: Hành vi NSX", text: "142. Nếu đồ thị hàm sản xuất ngày càng thoải thì năng suất cận biên đang tăng dần.", answer: "SAI", explain: "Đồ thị thoải dần chứng tỏ độ dốc giảm, tức là năng suất cận biên (MP) đang GIẢM DẦN." },
            { chapter: "Chương: Hành vi NSX", text: "143. Quỹ tích các điểm kết hợp tối ưu là cơ sở để xây dựng đường tổng chi phí dài hạn.", answer: "ĐÚNG", explain: "Quỹ tích đó được gọi là đường phát triển (Expansion Path)." },
            { chapter: "Chương: Hành vi NSX", text: "144. DN tối đa hóa lợi nhuận sẽ bán giá cao hơn và lượng thấp hơn DN tối đa hóa doanh thu.", answer: "ĐÚNG", explain: "Max Profit tại MR=MC. Max Revenue tại MR=0. Do MC>0 nên sản lượng max profit nhỏ hơn." },
            { chapter: "Chương: Hành vi NSX", text: "145. Đường chi phí bình quân dài hạn (LAC) là đường bao của các đường SAC ngắn hạn.", answer: "ĐÚNG", explain: "LAC được tạo thành từ tập hợp các quy mô tối ưu nhất của ngắn hạn." },
            { chapter: "Chương: Hành vi NSX", text: "146. Đường AP cắt đường MP tại điểm cực đại của đường MP.", answer: "SAI", explain: "Cắt nhau tại điểm CỰC ĐẠI CỦA AP, không phải của MP." },
            { chapter: "Chương: Hành vi NSX", text: "147. Nếu MPL / w > MPK / r thì hãng nên tăng sử dụng yếu tố lao động.", answer: "ĐÚNG", explain: "1 đồng chi cho lao động đang mang lại nhiều sản lượng hơn chi cho vốn." },
            { chapter: "Chương: Hành vi NSX", text: "148. Đường ATC ngắn hạn cắt đường MC tại điểm cực tiểu của MC.", answer: "SAI", explain: "MC sẽ luôn cắt ATC tại CỰC TIỂU CỦA ATC." },
            { chapter: "Chương: Hành vi NSX", text: "149. Quy luật năng suất cận biên giảm dần đúng cả trong ngắn hạn và dài hạn.", answer: "SAI", explain: "Quy luật này chỉ đúng trong NGẮN HẠN do có yếu tố đầu vào bị cố định." },
            { chapter: "Chương: Hành vi NSX", text: "150. Hàm Cobb-Douglass có α + β > 1 là hàm có hiệu suất giảm theo quy mô.", answer: "SAI", explain: "Tổng hệ số > 1 là hiệu suất TĂNG theo quy mô." },
            { chapter: "Chương: Hành vi NSX", text: "151. Với sản xuất có tính kinh tế theo quy mô, đường LMC luôn nằm trên đường LAC.", answer: "SAI", explain: "Tính kinh tế theo quy mô tức là LAC đang đi xuống, khi đó LMC phải nằm DƯỚI LAC." },
            { chapter: "Chương: Hành vi NSX", text: "152. Nếu hãng có hiệu suất không đổi theo quy mô, đường LAC dốc lên từ trái qua phải.", answer: "SAI", explain: "Hiệu suất không đổi thì chi phí bình quân LAC là một ĐƯỜNG NẰM NGANG." },
            { chapter: "Chương: Hành vi NSX", text: "153. Sự chuyên môn hóa giúp sản xuất ở quy mô lớn có chi phí thấp hơn.", answer: "ĐÚNG", explain: "Đây là nguyên nhân phổ biến nhất dẫn đến Tính kinh tế theo quy mô." },
            { chapter: "Chương: Hành vi NSX", text: "154. Đường đồng lượng thể hiện các kết hợp đầu vào khác nhau với cùng một mức lợi nhuận.", answer: "SAI", explain: "Đường đồng lượng thể hiện cùng một mức SẢN LƯỢNG, không phải lợi nhuận." },
            { chapter: "Chương: Hành vi NSX", text: "155. Tính phi kinh tế theo quy mô xuất hiện do mở rộng làm tăng chuyên môn hóa.", answer: "SAI", explain: "Phi kinh tế quy mô thường xuất hiện do khó khăn, cồng kềnh trong bộ máy quản lý." },
            { chapter: "Chương: Hành vi NSX", text: "156. Đường AVC có xu hướng tiệm cận đường ATC khi sản lượng tăng.", answer: "ĐÚNG", explain: "Vì ATC = AVC + AFC. Khi Q tăng, AFC tiến về 0 nên AVC tiến lại gần ATC." },
            { chapter: "Chương: Hành vi NSX", text: "157. Do quy luật MP giảm dần, đường MC là đường dốc lên từ trái qua phải.", answer: "ĐÚNG", explain: "Năng suất biên giảm thì chi phí để làm ra thêm 1 sản phẩm sẽ ngày càng tăng cao." },
            { chapter: "Chương: Hành vi NSX", text: "158. Để tối đa hóa lợi nhuận, hãng sản xuất tại mức có AR = AC.", answer: "SAI", explain: "Tối đa hóa lợi nhuận khi MR = MC. Mức AR = AC chỉ là điểm hòa vốn (lợi nhuận kinh tế = 0)." },
            { chapter: "Chương: Hành vi NSX", text: "159. Nếu không có tiếp điểm giữa đường đồng phí và đồng lượng thì không có kết hợp tối ưu.", answer: "SAI", explain: "Vẫn có thể đạt tối ưu ở Giải Pháp Góc (chỉ dùng toàn bộ Vốn hoặc toàn bộ Lao động)." },
            { chapter: "Chương: Hành vi NSX", text: "160. Khi tự dùng máy móc của mình thì chi phí kinh tế sẽ nhỏ hơn khi đi thuê.", answer: "SAI", explain: "Chi phí kinh tế tính cả Chi Phí Cơ Hội, tức là bỏ lỡ số tiền cho người khác thuê, nên chi phí bằng nhau." }
        ];

        function getRandomQuestion() {
            return questionBank[Math.floor(Math.random() * questionBank.length)];
        }

        const player = {
            x: 50, y: 150, width: 50, height: 50, 
            dy: 0, jumpPower: 5.5, gravity: 0.25,  
            
            draw: function() {
                if (playerImg.complete) ctx.drawImage(playerImg, this.x, this.y, this.width, this.height);
                else { ctx.fillStyle = "pink"; ctx.fillRect(this.x, this.y, this.width, this.height); }
            },
            update: function() {
                this.dy += this.gravity; this.y += this.dy;
                if (this.y + this.height > PLAY_AREA) { this.y = PLAY_AREA - this.height; this.dy = 0; }
                if (this.y < 0) { this.y = 0; this.dy = 0; } 
            },
            jump: function() { this.dy = -this.jumpPower; }
        };

        class Wall {
            constructor() {
                this.x = canvas.width;
                this.width = 120; 
                this.gateHeight = PLAY_AREA / 2; 
                
                this.qData = getRandomQuestion(); 
                this.correctIndex = (this.qData.answer === "ĐÚNG") ? 0 : 1; 

                this.passed = false;
                this.markedForDeletion = false;
            }
            update() {
                this.x -= gameSpeed;
                if (this.x + this.width < 0) this.markedForDeletion = true;

                if (!this.passed && this.x + this.width < player.x) {
                    score++; scoreEl.innerText = "Điểm: " + score;
                    this.passed = true;
                    if(score % 5 === 0) gameSpeed += 0.1; 
                }
            }
            draw() {
                const options = ["ĐÚNG", "SAI"];
                const colors = ["rgba(46, 204, 113, 0.9)", "rgba(231, 76, 60, 0.9)"]; 

                for (let i = 0; i < 2; i++) {
                    let gateY = i * this.gateHeight;

                    ctx.fillStyle = colors[i];
                    ctx.fillRect(this.x, gateY, this.width, this.gateHeight);
                    
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
                    ctx.strokeRect(this.x, gateY, this.width, this.gateHeight);

                    ctx.fillStyle = "#fff"; ctx.font = "bold 26px Arial";
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(options[i], this.x + this.width/2, gateY + this.gateHeight/2);
                }
            }
        }

        function checkCollision(p, wall) {
            let paddingX = 10; 
            
            if (p.x + p.width - paddingX > wall.x && p.x + paddingX < wall.x + wall.width) {
                let correctTop = wall.correctIndex * wall.gateHeight;
                let correctBottom = correctTop + wall.gateHeight;

                let margin = wall.gateHeight * 0.25; 
                let safeTop = correctTop - margin;
                let safeBottom = correctBottom + margin;

                let playerCenterY = p.y + p.height / 2;
                
                if (playerCenterY < safeTop || playerCenterY > safeBottom) {
                    let extraExplain = wall.qData.explain ? `\nGiải thích: ${wall.qData.explain}` : "";
                    infoEl.innerText = `Đáp án đúng là: ${wall.qData.answer} ${extraExplain}`;
                    return true; 
                }
            }
            return false;
        }

        function handleWalls() {
            if (walls.length === 0 || walls[walls.length - 1].x < canvas.width - 850) {
                walls.push(new Wall());
            }

            let activeWall = walls.find(w => w.x + w.width > player.x);
            if (activeWall) {
                chapterEl.innerText = activeWall.qData.chapter;
                questionEl.innerText = activeWall.qData.text;
            }

            for (let i = 0; i < walls.length; i++) {
                walls[i].update(); walls[i].draw();
                if (checkCollision(player, walls[i])) gameOver();
            }
            walls = walls.filter(w => !w.markedForDeletion);
        }

        function animate() {
            if (!gameRunning) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#34495e"; ctx.fillRect(0, PLAY_AREA, canvas.width, GROUND_HEIGHT);
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, PLAY_AREA + 5, canvas.width, 15);

            player.update(); player.draw(); handleWalls();
            frame++; requestAnimationFrame(animate);
        }

        function gameOver() {
            gameRunning = false;
            goScreen.style.display = 'flex';
        }

        function doAction(e) {
            if(e.cancelable) e.preventDefault(); 
            
            if (!gameRunning) {
                walls = []; score = 0; gameSpeed = 1.8; frame = 0;
                scoreEl.innerText = "Điểm: 0";
                goScreen.style.display = 'none';
                player.y = 150; player.dy = 0;
                gameRunning = true;
                animate();
            } else {
                player.jump();
            }
        }

        window.addEventListener('touchstart', doAction, {passive: false});
        window.addEventListener('mousedown', doAction);
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space' || e.key === ' ') doAction(e);
        });

        animate();

    </script>
</body>
</html>
